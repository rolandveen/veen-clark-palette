name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate derived palette files
        run: python tools/generate_exports.py
      - name: Reject stale generated files
        run: git diff --exit-code
      - name: Run consistency tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test example rendering
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/matplotlib
        run: python examples/blue_subgroups.py --output /tmp/veen-clark-examples
      - name: Smoke-test compiled PDF report
        run: python tools/build_pdf_report.py --output /tmp/veen-clark-palette-report.pdf
