name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate derived palette files
        run: python tools/generate_exports.py
      - name: Reject stale generated files
        run: git diff --exit-code
      - name: Validate committed release artifacts
        run: python tools/rebuild_all.py --check
      - name: Preserve committed scientific data for comparison
        run: cp -R reports/v0.1.0 /tmp/veen-clark-original-results
      - name: Rebuild all release artifacts from YAML
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/matplotlib
        run: python tools/rebuild_all.py
      - name: Reject changed scientific data
        run: python tools/compare_results.py /tmp/veen-clark-original-results reports/v0.1.0
